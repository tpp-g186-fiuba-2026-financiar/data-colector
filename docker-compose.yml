services:
  db_data_collector_postgres:
    image: postgres:15
    restart: always
    env_file:
      - .env

    environment:
      - POSTGRES_USERNAME
      - POSTGRES_PASSWORD
      - POSTGRES_DB  
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $POSTGRES_USERNAME -d $POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    
    networks:
      - financiar_shared_network

  service_data_collector:
    build: .
    ports:
      - "3000:3000"

    depends_on:
      db_data_collector_postgres:
        condition: service_healthy

    networks:
      - financiar_shared_network

    env_file:
      - .env

volumes:
  postgres_data:

networks:
  financiar_shared_network:
    external: true
